[project]
name = "proxmox-dashboard"
version = "0.3.0"
description = "Dynamic web dashboard for Proxmox VE that discovers running LXC containers and their services via the Proxmox API"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Peter Feerick"}]
license = "GPL-3.0-only"
dependencies = [
    "flask>=3.1.2",
    "pyyaml>=6.0.2",
    "requests>=2.32.5",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]

[tool.uv]
package = true

[project.scripts]
dashboard = "app:main"

[project.optional-dependencies]
tailscale = [
    "gunicorn>=23.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore::urllib3.exceptions.InsecureRequestWarning"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_files = [
    "pyproject.toml:project.version"
]
update_changelog_on_bump = true
tag_format = "v$version"
bump_message = "bump: version $current_version → $new_version"
pre_bump_hooks = [
    "uv lock",
    "git add uv.lock",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.djlint]
profile = "jinja"
ignore = "H021,H030,H031"

[dependency-groups]
dev = [
    "commitizen>=4.13.9",
    "djlint>=1.36.4",
    "pytest>=9.0.2",
    "ruff>=0.15.9",
]
