[project]
name = "proxmox-dashboard"
version = "0.1.0"
description = "Dynamic web dashboard for Proxmox VE that discovers running LXC containers and their services via the Proxmox API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.2",
    "pyyaml>=6.0.2",
    "requests>=2.32.5",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
tailscale = [
    "gunicorn>=23.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
