<svg width="680" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Option 1 container -->
  <rect x="30" y="20" width="185" height="160" rx="12" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="122" y="45" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">Option 1 — Local</text>
  <line x1="30" y1="54" x2="215" y2="54" stroke="#888780" stroke-width="0.5"/>
  <rect x="51" y="70" width="143" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text x="122" y="93" text-anchor="middle" font-size="13" font-weight="500" fill="#3c3489">Your machine</text>
  <text x="122" y="111" text-anchor="middle" font-size="11" fill="#534ab7">uv run app.py</text>
  <text x="122" y="148" text-anchor="middle" font-size="11" fill="#5f5e5a">localhost:8080</text>

  <!-- Option 2 container -->
  <rect x="247" y="20" width="185" height="160" rx="12" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="45" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">Option 2 — LXC</text>
  <line x1="247" y1="54" x2="432" y2="54" stroke="#888780" stroke-width="0.5"/>
  <rect x="268" y="70" width="143" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text x="340" y="93" text-anchor="middle" font-size="13" font-weight="500" fill="#3c3489">Proxmox LXC</text>
  <text x="340" y="111" text-anchor="middle" font-size="11" fill="#534ab7">systemd service</text>
  <text x="340" y="148" text-anchor="middle" font-size="11" fill="#5f5e5a">192.168.0.x:80</text>

  <!-- Option 3 container -->
  <rect x="464" y="20" width="185" height="160" rx="12" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="557" y="45" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">Option 3 — Tailscale</text>
  <line x1="464" y1="54" x2="649" y2="54" stroke="#888780" stroke-width="0.5"/>
  <rect x="485" y="70" width="143" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text x="557" y="93" text-anchor="middle" font-size="13" font-weight="500" fill="#3c3489">LXC + Tailscale</text>
  <text x="557" y="111" text-anchor="middle" font-size="11" fill="#534ab7">systemd + tailscaled</text>
  <text x="557" y="148" text-anchor="middle" font-size="11" fill="#5f5e5a">dashboard.tailnet.ts.net</text>

  <!-- Proxmox VE host (shared) -->
  <rect x="30" y="230" width="619" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="340" y="253" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Proxmox VE host</text>
  <text x="340" y="271" text-anchor="middle" font-size="11" fill="#0f6e56">Proxmox API — LXC container list + IPs</text>

  <!-- Arrows down to Proxmox -->
  <line x1="122" y1="180" x2="122" y2="228" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)" opacity="0.7"/>
  <line x1="340" y1="180" x2="340" y2="228" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)" opacity="0.7"/>
  <line x1="557" y1="180" x2="557" y2="228" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)" opacity="0.7"/>
</svg>
