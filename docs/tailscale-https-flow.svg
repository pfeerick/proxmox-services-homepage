<svg width="680" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0b80c8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Your device -->
  <rect x="20" y="90" width="115" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text x="77" y="113" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2c2a">Your device</text>
  <text x="77" y="131" text-anchor="middle" font-size="11" fill="#5f5e5a">any tailnet node</text>

  <!-- Arrow: device → Tailscale (HTTPS) -->
  <line x1="135" y1="118" x2="173" y2="118" stroke="#0b80c8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="154" y="110" text-anchor="middle" font-size="10" fill="#0b80c8">HTTPS</text>

  <!-- Tailscale node -->
  <rect x="175" y="78" width="140" height="80" rx="8" fill="#e8f4fd" stroke="#0b80c8" stroke-width="0.5"/>
  <text x="245" y="103" text-anchor="middle" font-size="13" font-weight="500" fill="#085a8c">Tailscale</text>
  <text x="245" y="121" text-anchor="middle" font-size="11" fill="#0b80c8">WireGuard tunnel</text>
  <text x="245" y="139" text-anchor="middle" font-size="11" fill="#0b80c8">MagicDNS · TLS cert</text>

  <!-- URL label above Tailscale -->
  <text x="245" y="70" text-anchor="middle" font-size="10" fill="#0b80c8" opacity="0.8">dashboard.tailnet.ts.net</text>

  <!-- Arrow: Tailscale → gunicorn (HTTP) -->
  <line x1="315" y1="118" x2="368" y2="118" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="342" y="110" text-anchor="middle" font-size="10" fill="#888">HTTP</text>

  <!-- Dashboard LXC outer box -->
  <rect x="370" y="20" width="290" height="220" rx="12" fill="#f9f9f7" stroke="#888780" stroke-width="0.5"/>
  <text x="515" y="42" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">Dashboard LXC</text>
  <line x1="370" y1="52" x2="660" y2="52" stroke="#888780" stroke-width="0.5"/>

  <!-- gunicorn box -->
  <rect x="385" y="68" width="260" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text x="515" y="91" text-anchor="middle" font-size="13" font-weight="500" fill="#3c3489">gunicorn</text>
  <text x="515" y="109" text-anchor="middle" font-size="11" fill="#534ab7">WSGI server · :8080</text>

  <!-- Arrow: gunicorn → Flask (internal) -->
  <line x1="515" y1="124" x2="515" y2="152" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Flask box -->
  <rect x="385" y="154" width="260" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text x="515" y="177" text-anchor="middle" font-size="13" font-weight="500" fill="#3c3489">Flask app</text>
  <text x="515" y="195" text-anchor="middle" font-size="11" fill="#534ab7">match containers · build URLs</text>

  <!-- Proxmox VE API -->
  <rect x="155" y="210" width="195" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="252" y="233" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Proxmox VE API</text>
  <text x="252" y="251" text-anchor="middle" font-size="11" fill="#0f6e56">LXC container list + IPs</text>

  <!-- Arrow: Flask → Proxmox API (dashed) -->
  <line x1="430" y1="210" x2="338" y2="210" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)" opacity="0.7"/>
  <text x="383" y="204" text-anchor="middle" font-size="10" fill="#888">API query</text>
</svg>
