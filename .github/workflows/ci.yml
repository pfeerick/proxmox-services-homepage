name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - "*.example"
      - ".github/workflows/release.yml"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - "*.example"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  # Everything except Biome, which has its own job below. Without this, shellcheck
  # and the config/hygiene validators only ever run on machines where someone
  # remembered `pre-commit install` — and `--no-verify` skips them there too.
  hooks:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: jdx/mise-action@v4

      - name: Run hooks
        # The biome hook shells out to `bun run check:fix`, which needs an install;
        # the dedicated Biome job below covers it without one.
        env:
          SKIP: biome
        run: pre-commit run --all-files --show-diff-on-failure

  # The commit-msg hook is skipped by `--no-verify`, and a malformed message
  # corrupts the changelog and can mislead `cz bump`'s version inference.
  commit-messages:
    name: Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # --rev-range needs the history, which the default shallow clone lacks.
          fetch-depth: 0

      - name: Set up commitizen
        uses: jdx/mise-action@v4
        with:
          install_args: pipx:commitizen

      # head.sha rather than HEAD: HEAD is the synthetic merge commit checkout
      # creates for a PR, and its "Merge ... into ..." message is not conventional.
      - name: Check commit messages
        run: cz check --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: jdx/mise-action@v4
        with:
          install_args: bun

      - name: Install dependencies
        run: bun install

      - name: Run Biome checks
        run: bun run check

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: jdx/mise-action@v4
        with:
          install_args: bun

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun test

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: jdx/mise-action@v4
        with:
          install_args: bun

      - name: Install dependencies
        run: bun install

      - name: TypeScript type check
        run: bun tsc --noEmit

  build:
    name: Build Frontend Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: jdx/mise-action@v4
        with:
          install_args: bun

      - name: Install dependencies
        run: bun install

      # install.sh builds this on every deploy, so a broken bundle would otherwise
      # only surface on a user's machine mid-install.
      - name: Build bundle
        run: bun run build

      - name: Verify bundle was produced
        run: test -s static/js/bundle.js
