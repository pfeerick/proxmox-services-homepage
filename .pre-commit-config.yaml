repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: mixed-line-ending
        args: [--fix=lf]
        stages: [pre-commit]

      # Catch malformed config before it reaches a running service or a workflow run.
      - id: check-yaml
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]

      # config.toml holds a Proxmox API token and is git-ignored; this is the
      # backstop for anything credential-shaped that gets force-added anyway.
      - id: detect-private-key
        stages: [pre-commit]

      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        # Two trailing spaces are a hard line break in Markdown — .editorconfig
        # already exempts *.md from trimming, so keep the hook consistent with it.
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: biome
        name: Biome (lint + format)
        entry: bun run check:fix
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        stages: [pre-commit]

  # Local, not upstream: otherwise pre-commit builds its own commitizen at a rev
  # that drifts from the pipx:commitizen in .mise.toml that runs `cz bump`.
  # Resolving `cz` from PATH needs mise's shims dir — see CONTRIBUTING.md.
  - repo: local
    hooks:
      - id: commitizen
        name: commitizen check
        entry: cz check
        args: [--allow-abort, --commit-msg-file]
        language: system
        stages: [commit-msg]
