# Service definitions for Proxmox LXC containers
# This file maps container names to their service information

services:
  paperless-ngx:
    port: 8000
    name: "Paperless-NGX"
    icon: "📄"
    description: "Document Management"
    
  wikijs:
    port: 3000
    name: "Wiki.js"
    icon: "📖"
    description: "Wiki Platform"
    
  homer:
    port: 8010
    name: "Homer Dashboard"
    icon: "🏠"
    description: "Static Dashboard"
    
  code-server:
    port: 8080
    name: "VS Code Server"
    icon: "💻"
    description: "Web-based IDE"
    
  syncthing:
    port: 8384
    name: "Syncthing"
    icon: "🔄"
    description: "File Synchronization"
    
  adguard:
    port: 3000
    name: "AdGuard Home"
    icon: "🛡️"
    description: "DNS Ad Blocker"
    
  jellyfin:
    port: 8096
    name: "Jellyfin"
    icon: "🎬"
    description: "Media Server"
    
  cloudflared:
    port: null  # No web interface
    name: "Cloudflare Tunnel"
    icon: "☁️"
    description: "Tunnel Service"
    
  unifi:
    port: 8443
    name: "UniFi Controller"
    icon: "📶"
    description: "Network Controller"
    protocol: "https"
    
  navidrome:
    port: 4533
    name: "Navidrome"
    icon: "🎵"
    description: "Music Server"
    
  dashy:
    port: 4000
    name: "Dashy Dashboard"
    icon: "📊"
    description: "Dashboard"
    
  homebox:
    port: 7745
    name: "Homebox"
    icon: "📦"
    description: "Home Inventory"
    
  myspeed:
    port: 5216
    name: "MySpeed"
    icon: "⚡"
    description: "Speed Test"
    
  pulse:
    port: 7655
    name: "Pulse"
    icon: "💓"
    description: "Proxmox Monitor"
    
  homepage:
    port: 3000
    name: "Homepage"
    icon: "🏡"
    description: "Dashboard"

# You can add more services here as you deploy new containers
# Format:
# service-name:
#   port: 1234
#   name: "Display Name"
#   icon: "🔸"
#   description: "Short description"
#   protocol: "https"  # Optional, defaults to "http"